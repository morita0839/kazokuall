<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かぞく 활쏘기 챌린지 (내 가족 + 남의 가족)</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--text:#2b2b2b;--sub:#777;--line:#e6dccb;--accent:#e8743b;--ok:#2e9e5b;--ng:#d64545;--okbg:#dff5e8;--ngbg:#fbe0e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b18;--card:#2a2723;--text:#f1ece4;--sub:#a79f93;--line:#443f37;--accent:#f08a55;--okbg:#1f3a2a;--ngbg:#43252a}}
:root[data-theme="dark"]{--bg:#1d1b18;--card:#2a2723;--text:#f1ece4;--sub:#a79f93;--line:#443f37;--accent:#f08a55;--okbg:#1f3a2a;--ngbg:#43252a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px;text-align:center}
h1{font-size:1.3rem;margin:8px 0}
.sub{color:var(--sub);font-size:.95rem;line-height:1.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
button{font:inherit;cursor:pointer}
.start{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 36px;font-size:1.2rem;font-weight:700}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .25s linear}
.emoji{font-size:2.6rem;line-height:1.2}
.q{font-size:2.2rem;font-weight:800}
.hint{color:var(--sub);font-size:.9rem}
.stage{position:relative;padding:6px 0 78px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.cell{background:none;border:0;padding:0;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px}
.tg{width:min(24vw,92px);aspect-ratio:1;border-radius:50%;border:3px solid #333;
background:radial-gradient(circle,#d64545 0 14%,#fff 14% 30%,#d64545 30% 46%,#fff 46% 62%,#4a90d9 62% 100%);transition:transform .2s,box-shadow .2s}
.plate{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 6px;font-size:.92rem;font-weight:800;text-align:center}
.cell.hit .tg{box-shadow:0 0 0 6px var(--ok);transform:scale(1.08)}
.cell.hit .plate{background:var(--okbg);border-color:var(--ok)}
.cell.miss .tg{box-shadow:0 0 0 6px var(--ng)}
.cell.miss .plate{background:var(--ngbg);border-color:var(--ng)}
.cell.answer .tg{box-shadow:0 0 0 6px var(--ok)}
.bow{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) rotate(-45deg);font-size:3rem;line-height:1}
.arrow{position:absolute;width:64px;height:4px;background:#8a5a2b;border-radius:2px;transform-origin:100% 50%;pointer-events:none;z-index:5}
.arrow::after{content:"";position:absolute;right:-9px;top:-5px;border-left:13px solid #555;border-top:7px solid transparent;border-bottom:7px solid transparent}
.arrow::before{content:"";position:absolute;left:-3px;top:-4px;width:10px;height:12px;background:var(--ng);border-radius:2px}
.pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;pointer-events:none;z-index:6;animation:pop .6s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-90%) scale(1.3)}}
.big{font-size:3rem;font-weight:800;color:var(--accent)}
.miss-l{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.miss-l span{background:var(--ngbg);border-radius:10px;padding:6px 10px;font-size:.95rem}
.bump{display:inline-block;animation:bump .35s}
@keyframes bump{40%{transform:scale(1.6);color:var(--accent)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center}
.fx .flash{position:absolute;inset:0;animation:fl .6s ease-out forwards}
@keyframes fl{from{opacity:.5}to{opacity:0}}
.fx .ban{position:relative;font-size:2.6rem;font-weight:900;text-align:center;line-height:1.2;text-shadow:0 3px 0 rgba(0,0,0,.3);animation:ban 1.3s ease-out forwards}
.fx .ban small{display:block;font-size:1.5rem}
@keyframes ban{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.25) rotate(3deg)}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
.fx .cf{position:absolute;left:50%;top:45%;font-size:1.6rem;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mcard{display:flex;align-items:center;gap:14px;background:var(--ngbg);border:3px solid var(--ng);border-radius:16px;padding:10px 16px;margin-top:10px;text-align:left}
.mcard .e{font-size:2.6rem}
.mcard .j{font-size:2.2rem;font-weight:900}
.mcard .k{font-size:1.3rem;font-weight:700;color:var(--ng)}
.perfect{font-size:1.3rem;font-weight:800;color:var(--ok);margin-top:12px}
.hide{display:none}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.words span{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:1.05rem}
</style>
</head>
<body>
<div class="wrap">
  <div id="start">
    <h1>かぞく 활쏘기 챌린지 🏹</h1>
    <div class="sub">わたしの かぞく + ひなたさんの かぞく</div>
    <div class="card">
      <div class="words" id="list"></div>
      <div class="sub">과녁이 6개! 내 가족과 남의 가족을 잘 구별해서 쏘세요!<br>정답마다 100점! 연속으로 맞히면 보너스 점수가 터져요 (3·6·9·12연속).</div>
    </div>
    <button class="start" onclick="startGame()">시작!</button>
  </div>

  <div id="game" class="hide">
    <div class="hud"><span>⭐ <b id="score">0</b></span><span id="combo"></span><span>⏱ <b id="time">60</b></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="card">
      <div class="emoji" id="emoji"></div>
      <div class="q" id="q"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="stage" id="stage">
      <div class="grid" id="grid"></div>
      <div class="bow">🏹</div>
    </div>
  </div>

  <div id="end" class="hide">
    <h1>끝! 수고했어요 🎉</h1>
    <div class="card">
      <div class="sub">총 득점</div>
      <div class="big" id="final"></div>
      <div class="sub" id="detail"></div>
      <div id="missWrap" class="hide"><div class="sub" style="margin-top:14px;font-weight:700">❗ 틀린 단어를 꼭 확인하세요</div><div id="miss"></div></div><div id="perfect" class="perfect hide">모두 맞혔어요! 완벽해요! 👑</div>
    </div>
    <button class="start" onclick="startGame()">다시 도전!</button>
  </div>
</div>

<script>
const W=[
 {jp:"ちち",ko:"우리 아빠",em:"dad",pair:"おとうさん"},
 {jp:"はは",ko:"우리 엄마",em:"mom",pair:"おかあさん"},
 {jp:"あに",ko:"우리 형/오빠",em:"bro",pair:"おにいさん"},
 {jp:"あね",ko:"우리 누나/언니",em:"sis",pair:"おねえさん"},
 {jp:"おとうと",ko:"우리 남동생",em:"boy",pair:"いもうとさん"},
 {jp:"おとうさん",ko:"(남의) 아버지",em:"dad",pair:"ちち"},
 {jp:"おかあさん",ko:"(남의) 어머니",em:"mom",pair:"はは"},
 {jp:"おにいさん",ko:"(남의) 형·오빠",em:"bro",pair:"あに"},
 {jp:"おねえさん",ko:"(남의) 누나·언니",em:"sis",pair:"あね"},
 {jp:"いもうとさん",ko:"(남의) 여동생",em:"girl",pair:"おとうと"}
];
const N=6;
const AVS={"dad": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#2e9e5b\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><path d=\"M50 57 Q47 63 51 63\" stroke=\"#c48a63\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M44 60 Q38 67 41 75\" stroke=\"#b9805a\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M56 60 Q62 67 59 75\" stroke=\"#b9805a\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"41\" cy=\"54\" r=\"7.8\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.2\"/><circle cx=\"59\" cy=\"54\" r=\"7.8\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.2\"/><path d=\"M48.8 54 H51.2 M33.2 54 L28 52 M66.8 54 L72 52\" stroke=\"#222\" stroke-width=\"2.2\" fill=\"none\"/><path d=\"M44 69 Q50 72 56 69\" stroke=\"#b5483a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M27 46 Q26 22 50 22 Q74 22 73 46 Q66 34 50 33 Q34 34 27 46Z\" fill=\"#2b2b2b\"/></svg>", "mom": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#8e6bbf\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><circle cx=\"24\" cy=\"52\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"26\" cy=\"68\" r=\"10\" fill=\"#7a4a24\"/><circle cx=\"30\" cy=\"34\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"42\" cy=\"25\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"58\" cy=\"25\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"70\" cy=\"34\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"76\" cy=\"52\" r=\"11\" fill=\"#7a4a24\"/><circle cx=\"74\" cy=\"68\" r=\"10\" fill=\"#7a4a24\"/><circle cx=\"50\" cy=\"22\" r=\"11\" fill=\"#7a4a24\"/><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"35\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><circle cx=\"65\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><path d=\"M42 65 Q50 74 58 65 Q50 68 42 65Z\" fill=\"#d6334a\" stroke=\"#d6334a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><circle cx=\"36\" cy=\"33\" r=\"8\" fill=\"#7a4a24\"/><circle cx=\"50\" cy=\"30\" r=\"8\" fill=\"#7a4a24\"/><circle cx=\"64\" cy=\"33\" r=\"8\" fill=\"#7a4a24\"/><circle cx=\"27\" cy=\"62\" r=\"2.6\" fill=\"#f2c230\"/><circle cx=\"73\" cy=\"62\" r=\"2.6\" fill=\"#f2c230\"/></svg>", "bro": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#d64545\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><path d=\"M35 47 H46 M54 47 H65\" stroke=\"#3a2a1a\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"35\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><circle cx=\"65\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><path d=\"M43 66 Q50 72 57 66\" stroke=\"#b5483a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M27 46 L29 28 L38 36 L44 20 L50 34 L58 20 L62 36 L71 28 L73 46 Q66 34 50 33 Q34 34 27 46Z\" fill=\"#3a2a1a\"/></svg>", "sis": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#f28fa3\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><path d=\"M23 54 Q21 20 50 20 Q79 20 77 54 L77 78 Q77 82 72 82 L64 82 L64 60 L36 60 L36 82 L28 82 Q23 82 23 78Z\" fill=\"#8b5a2b\"/><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"2.6\" fill=\"#333\"/><circle cx=\"35\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><circle cx=\"65\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><path d=\"M43 66 Q50 72 57 66\" stroke=\"#b5483a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M27 44 Q27 24 50 24 Q73 24 73 44Z\" fill=\"#8b5a2b\"/><circle cx=\"63\" cy=\"31\" r=\"3.6\" fill=\"#f2c230\"/></svg>", "boy": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#3bb3a1\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><g transform=\"translate(6 10) scale(.88)\"><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"3.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"3.6\" fill=\"#333\"/><circle cx=\"42.2\" cy=\"52.8\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"60.2\" cy=\"52.8\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"35\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><circle cx=\"65\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><ellipse cx=\"50\" cy=\"68\" rx=\"4.5\" ry=\"3.6\" fill=\"#b5483a\"/><path d=\"M27 46 Q26 24 50 24 Q74 24 73 46 Q64 34 50 36 Q36 34 27 46Z\" fill=\"#4a3220\"/><path d=\"M48 25 Q46 14 56 16\" stroke=\"#4a3220\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "girl": "<svg viewBox=\"0 0 100 100\" width=\"{S}\" height=\"{S}\" style=\"border-radius:50%;background:#fff3e0;vertical-align:middle\"><path d=\"M16 100 Q20 80 50 80 Q80 80 84 100Z\" fill=\"#f2c230\"/><rect x=\"44\" y=\"74\" width=\"12\" height=\"10\" fill=\"#f0c9a0\"/><g transform=\"translate(6 10) scale(.88)\"><circle cx=\"21\" cy=\"64\" r=\"10\" fill=\"#5a3a1c\"/><circle cx=\"79\" cy=\"64\" r=\"10\" fill=\"#5a3a1c\"/><ellipse cx=\"50\" cy=\"52\" rx=\"23\" ry=\"26\" fill=\"#ffdcb8\"/><circle cx=\"41\" cy=\"54\" r=\"3.6\" fill=\"#333\"/><circle cx=\"59\" cy=\"54\" r=\"3.6\" fill=\"#333\"/><circle cx=\"42.2\" cy=\"52.8\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"60.2\" cy=\"52.8\" r=\"1.1\" fill=\"#fff\"/><circle cx=\"35\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><circle cx=\"65\" cy=\"62\" r=\"4\" fill=\"#f7a8a0\" opacity=\".65\"/><path d=\"M43 66 Q50 72 57 66\" stroke=\"#b5483a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M27 46 Q26 24 50 24 Q74 24 73 46 L27 46Z\" fill=\"#5a3a1c\"/><circle cx=\"26\" cy=\"52\" r=\"4\" fill=\"#d64545\"/><circle cx=\"74\" cy=\"52\" r=\"4\" fill=\"#d64545\"/></g></svg>"};
function av(k,s){return AVS[k].split("{S}").join(s)}
const $=id=>document.getElementById(id);
$("list").innerHTML=W.map(w=>`<span>${av(w.em,34)} ${w.jp}</span>`).join("");
const TOTAL=60;
let score,tries,combo,left,timer,cur,locked,missed,last,hits;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}

function startGame(){
  score=0;hits=0;tries=0;combo=0;left=TOTAL;missed={};last=-1;locked=false;
  $("score").textContent=0;$("combo").textContent="";$("time").textContent=left;$("bar").style.width="100%";
  show("game");next();
  clearInterval(timer);
  timer=setInterval(()=>{
    left--;$("time").textContent=left;$("bar").style.width=(left/TOTAL*100)+"%";
    if(left<=0)finish();
  },1000);
}

function next(){
  locked=false;
  document.querySelectorAll(".arrow,.pop").forEach(e=>e.remove());
  let i;do{i=Math.floor(Math.random()*W.length)}while(i===last);
  last=i;cur=W[i];
  const jpToKo=Math.random()<0.5;
  cur.mode=jpToKo;
  if(jpToKo){$("emoji").textContent="";$("q").textContent=cur.jp;$("hint").textContent="우리말로 무엇일까요?"}
  else{$("emoji").innerHTML=av(cur.em,72);$("q").textContent=cur.ko;$("hint").textContent="일본어로 무엇일까요?"}
  const pr=W.find(w=>w.jp===cur.pair);const rest=shuffle(W.filter(w=>w!==cur&&w!==pr)).slice(0,N-2);const opts=shuffle([cur,pr,...rest]);
  $("grid").innerHTML="";
  opts.forEach(o=>{
    const c=document.createElement("button");
    c.className="cell";
    c.innerHTML=`<div class="tg"></div><div class="plate">${jpToKo?o.ko:o.jp}</div>`;
    c.onclick=()=>shoot(c,o);
    c._o=o;
    $("grid").appendChild(c);
  });
}

function shoot(cell,o){
  if(locked||left<=0)return;
  locked=true;tries++;
  const st=$("stage").getBoundingClientRect();
  const tr=cell.querySelector(".tg").getBoundingClientRect();
  const tx=tr.left+tr.width/2-st.left, ty=tr.top+tr.height/2-st.top;
  const sx=st.width/2, sy=st.height-28;
  const ang=Math.atan2(ty-sy,tx-sx)*180/Math.PI;
  const ar=document.createElement("div");
  ar.className="arrow";
  ar.style.left=(sx-64)+"px";ar.style.top=(sy-2)+"px";
  ar.style.transform="rotate("+ang+"deg)";
  $("stage").appendChild(ar);
  void ar.offsetWidth;
  ar.style.transition="left .3s ease-out, top .3s ease-out";
  ar.style.left=(tx-64)+"px";ar.style.top=(ty-2)+"px";
  setTimeout(()=>result(cell,o,tx,ty),320);
}

function result(cell,o,tx,ty){
  const pop=document.createElement("div");
  pop.className="pop";
  if(o===cur){
    hits++;combo++;let gain=100;const bn=BONUS[combo];if(bn)gain+=bn.pts;score+=gain;cell.classList.add("hit");
    pop.textContent="+"+gain+" 🎯";pop.style.color="var(--ok)";
    $("score").textContent=score.toLocaleString();bump($("score"));if(bn)fx(bn,combo);
    $("combo").textContent=combo>=3?"🔥 "+combo+"연속!":"";
    $("stage").appendChild(pop);
    setTimeout(next,bn?900:500);
  }else{
    combo=0;$("combo").textContent="";cell.classList.add("miss");$("stage").classList.remove("shake");void $("stage").offsetWidth;$("stage").classList.add("shake");
    missed[cur.jp]=cur;
    [...$("grid").children].forEach(c=>{if(c._o===cur)c.classList.add("answer")});
    pop.textContent="아쉬워요!";pop.style.color="var(--ng)";
    $("stage").appendChild(pop);
    setTimeout(next,1000);
  }
}

const BONUS={3:{pts:100,t:"NICE!",e:"🔥",c:"#e8743b",n:14},6:{pts:200,t:"GREAT!",e:"⚡",c:"#d4a017",n:24},9:{pts:300,t:"AMAZING!",e:"💥",c:"#d64545",n:36},12:{pts:400,t:"PERFECT!",e:"👑",c:"#8e44ad",n:50}};
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function fx(b,n){
  const o=document.createElement("div");o.className="fx";
  o.innerHTML=`<div class="flash" style="background:${b.c}"></div><div class="ban" style="color:${b.c}">${b.e} ${n}연속! ${b.e}<small>${b.t} 보너스 +${b.pts}</small></div>`;
  const E=["⭐","✨","🎉","🎊","🌟"];
  for(let i=0;i<b.n;i++){
    const s=document.createElement("span");s.className="cf";s.textContent=E[i%E.length];
    const a=Math.random()*Math.PI*2,d=120+Math.random()*180;
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");s.style.setProperty("--r",(Math.random()*720-360)+"deg");
    o.appendChild(s);
  }
  document.body.appendChild(o);setTimeout(()=>o.remove(),1400);
}
function finish(){
  clearInterval(timer);
  $("final").textContent=score.toLocaleString()+"점";
  $("detail").textContent=tries+"발 중 "+hits+"발 명중";
  const m=Object.values(missed);
  $("missWrap").classList.toggle("hide",m.length===0);$("perfect").classList.toggle("hide",m.length>0||tries===0);
  $("miss").innerHTML=m.map(w=>`<div class="mcard"><span class="e">${av(w.em,64)}</span><div><div class="j">${w.jp}</div><div class="k">${w.ko}</div></div></div>`).join("");
  show("end");
}
</script>
</body>
</html>
